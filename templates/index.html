<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Bot Stats</title>
<style>
body{background:#0a0a12;color:#ddd;font-family:monospace;padding:15px}
h2{color:#ffd700;font-size:14px;margin:0 0 8px}
.panel{background:#16161e;padding:12px;border-radius:6px;margin-bottom:12px;border:1px solid #2a2a33}
.stats{display:flex;gap:15px;flex-wrap:wrap}
.stat{background:#0a0a12;padding:8px 14px;border-radius:4px;border:1px solid #2a2a33}
.stat b{color:#ffd700;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid #2a2a33}
th{color:#888;font-weight:normal}.online{color:#3a8}.paused{color:#fa4}
button{background:#333;color:#ddd;border:0;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:10px;margin-right:3px}
#logs{background:#000;padding:10px;height:150px;overflow-y:auto;font-size:10px;white-space:pre-wrap;border-radius:4px}
</style></head><body>
<div class="panel"><h2>Stats</h2><div class="stats" id="stats"><span style="color:#666">loading...</span></div></div>
<div class="panel"><h2>Accounts</h2><table>
<thead><tr><th>UID</th><th>Nick</th><th>Lvl</th><th>Mode</th><th>EXP</th><th>Gained</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="accTable"><tr><td colspan="8" style="color:#666">no accounts</td></tr></tbody>
</table></div>
<div class="panel"><h2>Logs</h2><div id="logs"></div></div>
<script>
const $ = id => document.getElementById(id);
async function refresh(){try{
const d=await(await fetch('/api/stats')).json();
$('stats').innerHTML=`<div class="stat">accounts<br><b>${d.total_accounts||0}</b></div><div class="stat">matches<br><b>${d.total_matches||0}</b></div><div class="stat">active<br><b>${d.total_active_matches||0}</b></div><div class="stat">exp<br><b>${d.total_gained_exp||0}</b></div><div class="stat">exp/hr<br><b>${d.exp_per_hour||0}</b></div><div class="stat">uptime<br><b>${d.uptime||0}s</b></div>`;
const accs=d.accounts||[];
if(accs.length){$('accTable').innerHTML=accs.map(a=>`<tr><td>${a.uid||''}</td><td>${a.nickname||''}</td><td>${a.level||1}</td><td>${a.mode||''}</td><td>${a.current_exp||0}</td><td style="color:#3a8">+${a.gained_exp||0}</td><td class="${a.is_paused?'paused':'online'}">${a.is_paused?'paused':(a.status||'online')}</td><td><button onclick="act('pause','${a.uid}')">${a.is_paused?'resume':'pause'}</button><button onclick="act('restart','${a.uid}')">restart</button><button onclick="del('${a.uid}')">del</button></td></tr>`).join('')}
const logs=d.logs||[];
$('logs').innerHTML=logs.map(l=>`<div style="color:${l.level==='success'?'#3a8':l.level==='warning'?'#fa4':'#999'}">[${l.time}] ${l.message}</div>`).join('');
$('logs').scrollTop=$('logs').scrollHeight;
}catch(e){}}
async function act(kind,uid){const ep=kind==='pause'?'/api/account/pause':'/api/account/restart';await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})});refresh()}
async function del(uid){if(!confirm('Delete '+uid+'?'))return;await fetch('/api/account/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})});refresh()}
refresh();setInterval(refresh,3000);
</script></body></html>
